name: HubSpot Leads by Period

on:
  schedule:
    # Runs once daily at 13:00 UTC. Running daily (rather than trying to
    # pick exact "mid-month" and "month-end" dates in cron) is what lets the
    # script's own day-of-month check reliably catch the Mid window (1st-15th)
    # at least once, and the End window (16th-last day) at least once, every
    # month - without needing to guess how many days are in a given month or
    # worry about a single scheduled run getting delayed/skipped by GitHub.
    # Adjust the hour if you want it to run at a different time of day - this
    # is UTC, unrelated to the script's own America/New_York day-of-month logic.
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      backfill_current_month:
        description: 'Force BOTH current-month Mid and End columns to compute this run (one-time backfill)'
        required: false
        type: boolean
        default: false

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run HubSpot leads report
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BACKFILL_CURRENT_MONTH_NOW: ${{ github.event.inputs.backfill_current_month == 'true' && '1' || '' }}
        run: python hubspot_leads_by_period.py
